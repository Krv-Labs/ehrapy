tasks:
  - id: eda_qc_mimic2
    name: Exploratory Data Analysis & Quality Control on MIMIC-II
    steps:
      - tool: load_demo_dataset
        args:
          dataset: mimic_2
        assert_status: ok
        assert_contains:
          - edata_id
      - tool: get_edata_snapshot
        args: {}
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: qc_metrics
          params:
            qc_vars: []
        assert_status: ok
      - tool: run_get
        args:
          function: obs_df
          params:
            keys: ["missing_values_abs", "missing_values_pct"]
        assert_status: ok

  - id: clustering_pipeline
    name: Unsupervised Clustering & Differential Features
    steps:
      - tool: load_demo_dataset
        args:
          dataset: mimic_2
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: simple_impute
          params:
            var_names: ["gender_num"]
            strategy: most_frequent
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: encode
          params:
            autodetect: true
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: simple_impute
          params:
            strategy: mean
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: pca
        assert_status: ok
      - tool: run_preprocessing
        args:
          function: neighbors
        assert_status: ok
      - tool: run_analysis
        args:
          function: leiden
          params:
            resolution: 0.5
        assert_status: ok
      - tool: run_analysis
        args:
          function: rank_features_groups
          params:
            groupby: leiden
        assert_status: ok
      - tool: run_get
        args:
          function: rank_features_groups_df
          params:
            group: "0"
        assert_status: ok

  - id: survival_analysis
    name: Kaplan-Meier Survival Analysis
    steps:
      - tool: load_demo_dataset
        args:
          dataset: mimic_2
        assert_status: ok
      - tool: run_analysis
        args:
          function: kaplan_meier
          params:
            duration_col: mort_day_censored
            event_col: censor_flg
        assert_status: ok

  - id: fork_branching
    name: Dataset Handle Forking & Independent State
    steps:
      - tool: load_demo_dataset
        args:
          dataset: mimic_2
        assert_status: ok
      - tool: fork_edata_handle
        args:
          name: branched_cohort
        assert_status: ok
      - tool: get_edata_snapshot
        args: {}
        assert_status: ok

  - id: discovery_and_help
    name: Function Discovery & Signature Help
    steps:
      - tool: list_ehrapy_functions
        args:
          namespace: preprocessing
        assert_status: ok
      - tool: get_function_help
        args:
          namespace: preprocessing
          function: knn_impute
        assert_status: ok

  - id: workflow_guide_and_context
    name: Workflow Guide & Runtime Context
    steps:
      - tool: get_workflow_guide
        args: {}
        assert_status: ok
      - tool: get_runtime_context
        args: {}
        assert_status: ok
